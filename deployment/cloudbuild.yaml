steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deployment/Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=2
      - --no-allow-unauthenticated
substitutions:
  _SERVICE: verdictflow
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/verdictflow/verdictflow:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
